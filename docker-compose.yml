services:
  harbordrop:
    build: .
    image: harbordrop:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      APP_SECRET: "${APP_SECRET:?請在 .env 設定 APP_SECRET（至少 16 字元）}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?請在 .env 設定 ADMIN_PASSWORD}"
      # PUBLIC_URL: "https://drop.example.com"   # 反向代理後方時設定
    volumes:
      - ./data:/data
